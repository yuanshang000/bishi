app:
  name: "大学英语智慧助手"
  version: "1.0.0"
  description: "基于RAG和MCP的智能英语学习助手"

database:
  pool_size: 20
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 3600
  echo: false

llm:
  provider: "deepseek"
  model: "deepseek-chat"
  temperature: 0.7
  max_tokens: 4000  # 增加到4000以支持生成更多题目
  timeout: 120  # 增加到120秒以支持写作评分详细评语生成
  retry_times: 3
  retry_delay: 2

embedding:
  provider: "deepseek"
  model: "deepseek-embedding"
  dimension: 1024

document:
  chunk_size: 800
  chunk_overlap: 100
  separator: "\n\n"
  max_file_size: 52428800  # 50MB
  allowed_extensions:
    - ".pdf"
    - ".docx"
    - ".txt"

chromadb:
  persist_directory: "./data/chroma"
  collection_name: "course_embeddings"
  distance_metric: "cosine"
  n_results: 5

quiz:
  default_count: 5
  max_count: 20
  difficulties:
    - "easy"
    - "medium"
    - "hard"
  default_difficulty: "medium"

security:
  password_min_length: 6
  token_expire_hours: 24
  bcrypt_rounds: 12
